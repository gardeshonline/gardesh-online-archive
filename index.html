<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090A0B" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="نسخه جدید گردش به‌زودی در gardeshonline.com" />
    <meta property="og:title" content="گردش — به‌زودی" />
    <meta property="og:description" content="نسخه جدید گردش در راه است." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gardeshonline.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>گردش — به‌زودی</title>
    <style>
      :root{font-family:Vazirmatn,"IRANSansX",Tahoma,Arial,sans-serif;color:#f5f5f1;background:#090a0b;font-synthesis:none;text-rendering:optimizeLegibility}
      *{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}body{min-height:100vh;overflow:hidden;background:#090a0b}
      .landing{position:relative;isolation:isolate;min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:32px;background:radial-gradient(circle at 50% 42%,rgba(216,244,108,.055),transparent 26%),#090a0b}
      .landing:before{content:"";position:absolute;inset:18px;z-index:-1;border:1px solid rgba(255,255,255,.055);border-radius:28px;pointer-events:none}
      .ambient{position:absolute;z-index:-2;border-radius:999px;filter:blur(90px);pointer-events:none}.one{width:290px;height:290px;top:-140px;right:8%;background:rgba(216,244,108,.08)}.two{width:240px;height:240px;bottom:-130px;left:9%;background:rgba(92,72,132,.055)}
      .content{width:min(92vw,680px);display:flex;flex-direction:column;align-items:center;text-align:center;animation:enter .7s cubic-bezier(.22,1,.36,1) both}
      .logo-frame{width:clamp(122px,16vw,166px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:42px;border:1px solid rgba(255,255,255,.08);border-radius:34px;background:#0e1310;box-shadow:0 24px 72px rgba(0,0,0,.35),0 0 0 1px rgba(216,244,108,.06)}
      .logo{width:70%;height:70%;object-fit:contain;display:block}.eyebrow{margin:0 0 15px;color:#d8f46c;font-size:12px;font-weight:500;letter-spacing:.18em}
      h1{margin:0;color:#f5f5f1;font-size:clamp(48px,8vw,82px);line-height:1.05;font-weight:700;letter-spacing:-.055em}.subtitle{margin:22px 0 0;color:#8d9095;font-size:clamp(14px,2vw,17px);font-weight:400;line-height:1.9}
      footer{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);color:rgba(245,245,241,.34);font-size:11px;letter-spacing:.12em;direction:ltr}
      @keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
      @media(max-width:640px){.landing{padding:22px}.landing:before{inset:12px;border-radius:22px}.logo-frame{margin-bottom:34px;border-radius:28px}footer{bottom:30px}}
      @media(prefers-reduced-motion:reduce){.content{animation:none}}
    </style>
  </head>
  <body>
    <main class="landing">
      <div class="ambient one" aria-hidden="true"></div><div class="ambient two" aria-hidden="true"></div>
      <section class="content" aria-labelledby="coming-soon-title">
        <div class="logo-frame"><img src="/logo.png" alt="لوگوی گردش" class="logo" /></div>
        <p class="eyebrow">گردش</p><h1 id="coming-soon-title">به‌زودی</h1><p class="subtitle">نسخه‌ی جدید گردش در راه است.</p>
      </section>
      <footer>gardeshonline.com</footer>
    </main>
  </body>
</html>
